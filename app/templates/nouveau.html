{% extends "base.html" %}
{% block titre %}Nouvelle commande{% endblock %}
{% block contenu %}
<div class="entete-page"><h1>Nouvelle commande</h1></div>
<form method="post" action="/dossiers/nouveau" enctype="multipart/form-data" id="form-commande" style="max-width:860px">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <div class="titre-bloc"><h2>Bon de commande</h2></div>
  <div class="carte">
    <div class="puces mb-3">
      {% for e in exemples %}<button type="button" class="puce" data-index="{{ loop.index0 }}">{{ e.titre.split(' :')[0] }}</button>{% endfor %}
    </div>
    <textarea class="form-control mono" id="texte_commande" name="texte_commande" rows="7" aria-label="Message du client"
      placeholder="Collez le message du client"></textarea>
    <div class="row g-3 mt-1">
      <div class="col-md-6">
        <label class="form-label" for="document"><i class="ti ti-camera"></i> Photo ou PDF</label>
        <input class="form-control" type="file" id="document" name="document" accept="image/jpeg,image/png,image/webp,application/pdf">
      </div>
      <div class="col-md-3">
        <label class="form-label" for="canal">Canal</label>
        <select class="form-select" id="canal" name="canal">{% for k, v in CANAUX.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select>
      </div>
      <div class="col-md-3">
        <label class="form-label" for="extracteur">Lecture</label>
        <select class="form-select" id="extracteur" name="extracteur">{% for k, v in EXTRACTEURS.items() %}<option value="{{ k }}" {% if k == extracteur_defaut %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>
      </div>
    </div>
  </div>
  <div class="titre-bloc mt-4"><h2>Bon de livraison</h2><span class="lien">facultatif</span></div>
  <div class="carte">
    <textarea class="form-control mono" id="texte_livraison" name="texte_livraison" rows="3" aria-label="Bon de livraison"
      placeholder="Collez le bon de livraison"></textarea>
  </div>
  <div class="actions mt-4">
    <button class="btn btn-primary btn-grand" type="submit"><i class="ti ti-sparkles"></i>&nbsp;Préparer le brouillon</button>
    <a class="btn btn-ghost-secondary" href="/">Annuler</a>
  </div>
</form>
{% endblock %}
{% block scripts %}
<script>
const EXEMPLES = {{ exemples|tojson }};
document.querySelectorAll('[data-index]').forEach(b => b.addEventListener('click', () => {
  const e = EXEMPLES[+b.dataset.index];
  document.getElementById('texte_commande').value = e.commande || '';
  document.getElementById('texte_livraison').value = e.livraison || '';
  document.getElementById('canal').value = e.canal || 'WHATSAPP';
  document.querySelectorAll('[data-index]').forEach(x => x.style.borderColor = x === b ? 'var(--accent)' : '');
}));
document.getElementById('form-commande').addEventListener('submit', e => {
  const b = e.target.querySelector('button[type=submit]');
  b.disabled = true; b.innerHTML = '<span class="spinner-border spinner-border-sm"></span>&nbsp;Lecture…';
});
</script>
{% endblock %}
